<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Tanaka</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <img src="logo.jpeg" alt="Logo" class="form-logo">
                <h1>Registration Form</h1>

        <form action="#" method="post">

            <!-- Nama lengkap -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    placeholder="Enter your full name"
                    required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email"
                    required>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="text" 
                    id="phone" 
                    name="phone" 
                    placeholder="Enter your phone number"
                    required>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>

                <div class="option-group">
                    <div>
                        <input 
                            type="radio" 
                            id="male" 
                            name="gender" 
                            value="Male"
                            required>
                        <label for="male">Male</label>
                    </div>

                    <div>
                        <input 
                            type="radio" 
                            id="female" 
                            name="gender" 
                            value="Female">
                        <label for="female">Female</label>
                    </div>
                </div>
            </div>

            <!-- Hobbies -->
            <div class="form-group">
                <label>Hobbies</label>

                <div class="option-group">
                    <div>
                        <input 
                            type="checkbox" 
                            id="music" 
                            name="hobbies" 
                            value="Listening to Music">
                        <label for="music">Listening to Music</label>
                    </div>

                    <div>
                        <input 
                            type="checkbox" 
                            id="sports" 
                            name="hobbies" 
                            value="Sports">
                        <label for="sports">Sports</label>
                    </div>

                    <div>
                        <input 
                            type="checkbox" 
                            id="gaming" 
                            name="hobbies" 
                            value="Gaming">
                        <label for="gaming">Gaming</label>
                    </div>
                </div>
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label for="dob">Date of Birth</label>

                <input 
                    type="date" 
                    id="dob" 
                    name="dob"
                    required>
            </div>

            <!-- Program of Study -->
            <div class="form-group">
                <label for="program">Program of Study</label>

                <select id="program" name="program" required>
                    <option value="">-- Select Program --</option>

                    <option value="Information Systems">
                        Information Systems
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Business Management">
                        Business Management
                    </option>

                    <option value="Accounting">
                        Accounting
                    </option>

                    <option value="Communication">
                        Communication
                    </option>
                </select>
            </div>

            <!-- Full Address -->
            <div class="form-group">
                <label for="address">Full Address</label>

                <textarea 
                    id="address" 
                    name="address" 
                    placeholder="Enter your full address"
                    required></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-button">
                Submit Registration
            </button>

        </form>
    </main>

</body>
</html>
